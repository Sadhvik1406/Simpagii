<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="60%" stop-color="#08080a" />
      <stop offset="100%" stop-color="#020202" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Pitch Black Container with Soft Vignette -->
  <rect width="512" height="512" rx="64" fill="url(#bgGlow)" />

  <!-- "Simpl" Sans-Serif Typography -->
  <text 
    x="256" 
    y="225" 
    text-anchor="middle" 
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
    font-size="94" 
    font-weight="600" 
    fill="#ffffff" 
    letter-spacing="-1px"
  >
    Simpl
  </text>

  <!-- "Agi" Calligraphic Script Flourish -->
  <g transform="translate(110, 240)">
    <!-- Swirling Calligraphic 'A' -->
    <path 
      d="M30,110 C10,95 0,70 15,45 C25,25 55,20 80,35 C105,50 120,95 105,125 C95,145 65,155 45,145 C25,135 25,115 45,100 C70,80 100,75 125,90 C140,100 145,120 135,140 C120,170 85,185 50,180" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="7" 
      stroke-linecap="round"
    />
    <path 
      d="M65,40 Q105,10 135,55 L95,145" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="6" 
      stroke-linecap="round"
    />

    <!-- Elegant 'g' loop with descending tail -->
    <circle cx="170" cy="95" r="28" fill="none" stroke="#ffffff" stroke-width="7" />
    <path 
      d="M198,80 L198,135 C198,175 160,195 130,190 C100,185 85,160 105,145 C125,130 160,145 190,165 C220,185 240,175 245,155" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="6" 
      stroke-linecap="round"
    />

    <!-- 'i' with Circuit Board PCB Traces -->
    <g transform="translate(215, 60)">
      <!-- 'i' stem and dot -->
      <circle cx="20" cy="12" r="8" fill="#ffffff" />
      <rect x="15" y="32" width="10" height="65" rx="3" fill="#ffffff" />
      <path d="M10,97 L30,97" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />

      <!-- Circuit Traces & Solder Nodes -->
      <!-- Left trace -->
      <path d="M15,48 L-5,48 L-5,65" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <circle cx="-5" cy="65" r="3.5" fill="#ffffff" />

      <!-- Right upper trace -->
      <path d="M25,42 L42,42 L42,28 L55,28" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <circle cx="55" cy="28" r="3.5" fill="#ffffff" />

      <!-- Right middle trace -->
      <path d="M25,58 L48,58 L48,72 L62,72" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <circle cx="62" cy="72" r="3.5" fill="#ffffff" />

      <!-- Right lower looping trace -->
      <path d="M25,78 L40,78 Q55,80 55,95 Q55,110 70,110" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <circle cx="70" cy="110" r="3.5" fill="#ffffff" />
    </g>
  </g>

  <!-- Bottom-Right Diamond Sparkle Star -->
  <path 
    d="M440,430 Q440,445 425,445 Q440,445 440,460 Q440,445 455,445 Q440,445 440,430 Z" 
    fill="#888892" 
    opacity="0.8" 
  />
</svg>
